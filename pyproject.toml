[project]
name = "mcp-engenharia-ia"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "mcp[cli]>=2.2.0",
    "pypdf>=6.19.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET"]
